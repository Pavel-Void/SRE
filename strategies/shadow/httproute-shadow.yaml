apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: deploy-demo
spec:
  parentRefs:
    - name: eg
  rules:
    - backendRefs:
        - name: backend-v1
          port: 8080
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: backend-v2
              port: 8080
