name: CI Build & Test

on:
  push:
    branches: [ "main", "dev_test", "dev" ]
  pull_request:
    branches: [ "main", "dev_test", "dev" ]

jobs:
  backend-check:
    name: Backend (Java 21 & Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile and check dependencies
        run: ./gradlew compileJava --no-daemon

      - name: Build bootJar artifact
        run: ./gradlew bootJar -x test --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Docker build
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: false
          tags: park_psu_backend:test

  frontend-check:
    name: Frontend (Next.js 15 & React 19)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Linter
        run: npm run lint

      - name: Build Standalone Next.js Artifact
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Frontend Docker build
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: false
          tags: park_psu_frontend:test
