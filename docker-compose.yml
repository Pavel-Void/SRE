services:
  postgres:
    image: postgres:16-alpine
    container_name: park_psu_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:park_psu}
      POSTGRES_USER: ${POSTGRES_USER:postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:postgres} -d $${POSTGRES_DB:park_psu}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: park_psu_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:park_psu}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:postgres}
      JWT_SECRET: ${JWT_SECRET:itkICswj9AWlYWLK6GEmcEsFDVkRemVHcAliKSEAXgw=}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
      SCHEDULING_ENABLED: "true"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:http://localhost:8080}
    container_name: park_psu_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:http://localhost:8080}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
