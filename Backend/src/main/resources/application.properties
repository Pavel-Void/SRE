spring.application.name=park_psu

# Port binding & Graceful shutdown (Factors 7 & 9)
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Backing Services - Database (Factors 3 & 4)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/park_psu}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JPA & Liquibase
spring.liquibase.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}

# Security & JWT (Factor 3)
jwt.secret=${JWT_SECRET:itkICswj9AWlYWLK6GEmcEsFDVkRemVHcAliKSEAXgw=}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# Process Concurrency & Background Worker (Factor 8)
app.scheduling.enabled=${SCHEDULING_ENABLED:true}

# Structured Logging (JSON to stdout)
logging.structured.format.console=ecs
logging.structured.ecs.service.name=park-backend