apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-rules
  namespace: default
  labels:
    role: alert-rules
data:
  alerts.yaml: |
    groups:
      - name: park-psu-service-alerts
        interval: 10s
        rules:
          # Алерт 1 (Метрики сервиса): Высокий уровень ошибок API (> 5%)
          - alert: HighHttpErrorRate
            expr: |
              clamp_max(clamp_min((sum(rate(http_server_requests_seconds_count{status!~"2.."}[1m])) or vector(0)) / (sum(rate(http_server_requests_seconds_count[1m])) or vector(1)) * 100, 0), 100) > 5
            for: 20s
            labels:
              severity: critical
              component: backend
            annotations:
              summary: "Высокая доля ошибок API (> 5%)"
              description: "Доля клиентских и серверных ошибок бэкенда за последнюю минуту превышает SLA порог 5% (зафиксировано: {{ $value | printf \"%.2f\" }}%). Сервис деградирует."
              resolved_summary: "Доступность API восстановлена (ошибки < 5%)"
              resolved_description: "Доля ошибочных HTTP-ответов бэкенда вернулась в норму (ниже порога SLA 5.0%). Сервис работает стабильно."

          # Алерт 2 (Метрики сервиса): Отказ внешнего синтетического пробера
          - alert: ProberServiceDown
            expr: app_prober_probe_success{target="health"} == 0
            for: 20s
            labels:
              severity: critical
              component: prober
            annotations:
              summary: "Отказ доступности сервиса по данным внешнего пробера"
              description: "Внешний синтетический зонд фиксирует сбой при обращении к /actuator/health более 20 секунд. Сервис недоступен пользователям."
              resolved_summary: "Доступность сервиса по внешнему проберу восстановлена"
              resolved_description: "Внешний пробер снова успешно получает код 200 OK от /actuator/health."

          # Алерт 3 (Метрики сервиса): Всплеск неудачных попыток входа
          - alert: HighAuthFailureRate
            expr: sum(rate(parking_auth_attempts_total{status="failed"}[1m])) > 0.5
            for: 15s
            labels:
              severity: warning
              component: auth
            annotations:
              summary: "Аномальное количество неудачных попыток авторизации"
              description: "Частота неудачных попыток входа превышает 0.5 оп/сек (зафиксировано: {{ $value | printf \"%.2f\" }} оп/сек). Возможен сбой аутентификации или подбор паролей."
              resolved_summary: "Частота неудачных авторизаций нормализовалась"
              resolved_description: "Поток ошибочных попыток входа опустился ниже 0.5 оп/сек."

      - name: park-psu-runtime-alerts
        interval: 10s
        rules:
          # Алерт 4 (Метрики рантайма / Spring Actuator): Высокое потребление Heap памяти JVM
          # Боевой порог > 80%; во время демо-теста trigger_alerts.js временно переключает порог на > 25% и возвращает обратно
          - alert: JvmHeapMemoryUsageHigh
            expr: |
              (sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"} > 0)) * 100 > 80
            for: 15s
            labels:
              severity: warning
              component: jvm
            annotations:
              summary: "Высокое потребление памяти JVM Heap"
              description: "Процесс Spring Boot утилизирует {{ $value | printf \"%.2f\" }}% выделенной памяти Heap. Риск аварийного завершения по OutOfMemoryError."
              resolved_summary: "Потребление памяти JVM Heap в норме"
              resolved_description: "Использование памяти Heap вернулось в допустимые пределы (ниже порога срабатывания)."

          # Алерт 5 (Метрики рантайма / Spring Actuator): Исчерпание пула соединений HikariCP
          - alert: HikariPoolExhaustion
            expr: |
              sum(hikaricp_connections_pending) > 0 or (sum(hikaricp_connections_active) / sum(hikaricp_connections_max) * 100 > 80)
            for: 20s
            labels:
              severity: critical
              component: database-pool
            annotations:
              summary: "Исчерпание пула соединений с БД HikariCP"
              description: "В пуле HikariCP зафиксированы ожидающие запросы (pending > 0) либо пул соединений к PostgreSQL загружен на {{ $value | printf \"%.2f\" }}%."
              resolved_summary: "Пул соединений HikariCP с PostgreSQL восстановлен"
              resolved_description: "Очередь ожидания соединений к БД пуста, загрузка пула вернулась в штатные пределы."
---
