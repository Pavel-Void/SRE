# ========================================================
# 1. DATABASE (PostgreSQL 16)
# ========================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    app: postgres
type: Opaque
stringData:
  POSTGRES_DB: "park_psu"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  labels:
    app: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: TZ
              value: "Asia/Yekaterinburg"
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
---
# ========================================================
# 2. BACKEND (Spring Boot 3.4.3)
# ========================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app: backend
data:
  PORT: "8080"
  TZ: "Asia/Yekaterinburg"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/park_psu"
  SPRING_DATASOURCE_USERNAME: "postgres"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080,http://localhost:30000"
  SCHEDULING_ENABLED: "true"
  LOGGING_STRUCTURED_FORMAT_CONSOLE: "ecs"

---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  labels:
    app: backend
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "postgres"
  JWT_SECRET: "itkICswj9AWlYWLK6GEmcEsFDVkRemVHcAliKSEAXgw="
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: sre-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: http
---
# ========================================================
# 3. FRONTEND (Next.js 15)
# ========================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  labels:
    app: frontend
data:
  PORT: "3000"
  NEXT_PUBLIC_API_URL: "http://localhost:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: sre-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: frontend-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
      name: http
---
# ========================================================
# 4. VICTORIA LOGS (Single-Node)
# ========================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-logs-pvc
  labels:
    app: victoria-logs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs
  labels:
    app: victoria-logs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoria-logs
  template:
    metadata:
      labels:
        app: victoria-logs
    spec:
      containers:
        - name: victoria-logs
          image: victoriametrics/victoria-logs:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-storageDataPath=/victoria-logs-data"
            - "-httpListenAddr=:9428"
            - "-retentionPeriod=7d"
          ports:
            - name: http
              containerPort: 9428
          volumeMounts:
            - name: victoria-logs-data
              mountPath: /victoria-logs-data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 9428
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9428
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
      volumes:
        - name: victoria-logs-data
          persistentVolumeClaim:
            claimName: victoria-logs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  labels:
    app: victoria-logs
spec:
  type: ClusterIP
  selector:
    app: victoria-logs
  ports:
    - name: http
      port: 9428
      targetPort: 9428
---
# ========================================================
# 5. LOG SHIPPER (DaemonSet)
# ========================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: log-shipper-config
  namespace: default
data:
  VL_URL: "http://victoria-logs.default.svc.cluster.local:9428/insert/jsonline?_stream_fields=namespace,container,service.name&_msg_field=message&_time_field=timestamp"
  LOG_DIR: "/var/log/pods"
  POLL_INTERVAL_MS: "2000"
  NAMESPACE_FILTER: "default"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: log-shipper-bin
  namespace: default
data:
  shipper.js: |
    const fs = require('fs');
    const path = require('path');
    const http = require('http');

    const VL_URL = process.env.VL_URL;
    const LOG_DIR = process.env.LOG_DIR;
    const POLL_INTERVAL_MS = parseInt(process.env.POLL_INTERVAL_MS || '2000', 10);
    const NAMESPACE_FILTER = process.env.NAMESPACE_FILTER || 'default';

    if (!VL_URL || !LOG_DIR) {
      console.error('Fatal configuration error: VL_URL and LOG_DIR environment variables must be defined.');
      process.exit(1);
    }

    const fileStates = new Map();

    function sendLogs(batch) {
      if (!batch || batch.length === 0) return;
      const payload = batch.map(item => JSON.stringify(item)).join('\n') + '\n';
      
      const url = new URL(VL_URL);
      const req = http.request({
        hostname: url.hostname,
        port: url.port,
        path: url.pathname + url.search,
        method: 'POST',
        headers: {
          'Content-Type': 'application/stream+json',
          'Content-Length': Buffer.byteLength(payload)
        }
      }, (res) => {
        res.resume();
      });
      req.on('error', (err) => console.error('Error sending logs to VictoriaLogs:', err.message));
      req.write(payload);
      req.end();
    }

    function isStackTraceLine(line) {
      if (!line) return false;
      const trimmed = line.trim();
      if (trimmed.startsWith('at ') || trimmed.startsWith('Caused by:') || trimmed.startsWith('Suppressed:')) return true;
      if (/^\.\.\.\s+\d+\s+more/.test(trimmed)) return true;
      if (/^[a-zA-Z0-9_$.]+(Exception|Error):/.test(trimmed)) return true;
      if (line.startsWith('\t') || line.startsWith('   ')) return true;
      return false;
    }

    function parseCriLine(rawLine) {
      if (!rawLine || !rawLine.trim()) return null;
      const parts = rawLine.split(' ');
      if (parts.length < 4) return null;
      
      const criTime = parts[0];
      const stream = parts[1]; // stdout | stderr
      const tag = parts[2];    // F (full) | P (partial)
      const headerLen = criTime.length + 1 + stream.length + 1 + tag.length + 1;
      const payload = rawLine.substring(headerLen);
      
      return { criTime, stream, tag, payload };
    }

    function createRecord(criTime, stream, payload, filePath) {
      const segments = filePath.split(path.sep);
      const container = segments[segments.length - 2] || 'unknown';
      const podFolder = segments[segments.length - 3] || '';
      const folderParts = podFolder.split('_');
      const namespace = folderParts[0] || 'default';
      const pod = folderParts[1] || container;

      let record = {
        timestamp: criTime,
        stream: stream,
        namespace: namespace,
        pod: pod,
        container: container,
        'service.name': container === 'backend' ? 'park-backend' : (container === 'frontend' ? 'park-frontend' : container),
        message: payload,
        level: stream === 'stderr' ? 'ERROR' : 'INFO'
      };

      const trimmed = payload.trim();
      if (trimmed.startsWith('{') && trimmed.endsWith('}')) {
        try {
          const parsed = JSON.parse(trimmed);
          Object.assign(record, parsed);
          
          if (parsed.message) record.message = parsed.message;
          if (parsed.level) record.level = String(parsed.level).toUpperCase();
          else if (parsed['log.level']) record.level = String(parsed['log.level']).toUpperCase();
          
          if (parsed['service.name']) record['service.name'] = parsed['service.name'];
          else if (parsed.service_name) record['service.name'] = parsed.service_name;

          if (parsed['@timestamp']) record.timestamp = parsed['@timestamp'];
          else if (parsed.timestamp) record.timestamp = parsed.timestamp;

          if (parsed['log.logger']) record.logger = parsed['log.logger'];
          else if (parsed.logger_name) record.logger = parsed.logger_name;

          if (parsed['process.thread.name']) record.thread = parsed['process.thread.name'];
          else if (parsed.thread_name) record.thread = parsed.thread_name;

          if (parsed['error.stack_trace']) record['error.stack_trace'] = parsed['error.stack_trace'];
        } catch (e) {
          // Keep raw fallback
        }
      } else {
        // Non-JSON heuristics
        if (/ERROR|Exception|Error:/i.test(payload) || stream === 'stderr') {
          record.level = 'ERROR';
        } else if (/WARN|Warning:/i.test(payload)) {
          record.level = 'WARN';
        }
      }

      return record;
    }

    function scanAndRead() {
      function findLogFiles(dir) {
        let results = [];
        try {
          const list = fs.readdirSync(dir);
          for (const file of list) {
            const fullPath = path.join(dir, file);
            const stat = fs.statSync(fullPath);
            if (stat.isDirectory()) {
              results = results.concat(findLogFiles(fullPath));
            } else if (file.endsWith('.log')) {
              results.push(fullPath);
            }
          }
        } catch (e) {}
        return results;
      }

      const files = findLogFiles(LOG_DIR);
      const batch = [];

      for (const file of files) {
        if (!file.includes(NAMESPACE_FILTER + '_')) continue;
        if (file.includes('shipper')) continue;

        try {
          const stat = fs.statSync(file);
          let state = fileStates.get(file);
          if (!state) {
            state = { offset: 0, partialBuffer: '', activeRecord: null };
            fileStates.set(file, state);
          }

          if (stat.size < state.offset) {
            state.offset = 0;
            state.partialBuffer = '';
            state.activeRecord = null;
          }

          if (stat.size > state.offset) {
            const fd = fs.openSync(file, 'r');
            const buffer = Buffer.alloc(stat.size - state.offset);
            fs.readSync(fd, buffer, 0, buffer.length, state.offset);
            fs.closeSync(fd);
            state.offset = stat.size;

            const rawLines = buffer.toString('utf8').split('\n');
            for (const rawLine of rawLines) {
              if (!rawLine) continue;
              const parsedCri = parseCriLine(rawLine);
              if (!parsedCri) continue;

              // CRI Partial line assembly
              if (parsedCri.tag === 'P') {
                state.partialBuffer += parsedCri.payload;
                continue;
              }

              let fullPayload = state.partialBuffer + parsedCri.payload;
              state.partialBuffer = '';

              // Check if this line is a continuation of a multiline stack trace
              if (isStackTraceLine(fullPayload) && state.activeRecord) {
                state.activeRecord.message += '\n' + fullPayload;
                if (!state.activeRecord['error.stack_trace']) {
                  state.activeRecord['error.stack_trace'] = fullPayload;
                } else {
                  state.activeRecord['error.stack_trace'] += '\n' + fullPayload;
                }
                state.activeRecord.level = 'ERROR';
                continue;
              }

              // New distinct log entry
              if (state.activeRecord) {
                batch.push(state.activeRecord);
                state.activeRecord = null;
              }

              state.activeRecord = createRecord(parsedCri.criTime, parsedCri.stream, fullPayload, file);
            }

            // Flush active record if any
            if (state.activeRecord) {
              batch.push(state.activeRecord);
              state.activeRecord = null;
            }
          }
        } catch (e) {
          console.error(`Error processing file ${file}:`, e.message);
        }
      }

      if (batch.length > 0) {
        sendLogs(batch);
      }
    }

    console.log(`Victoria Logs Log-Shipper started. Target: ${VL_URL}, Dir: ${LOG_DIR}`);
    scanAndRead();
    setInterval(scanAndRead, POLL_INTERVAL_MS);
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-shipper
  namespace: default
  labels:
    app: log-shipper
spec:
  selector:
    matchLabels:
      app: log-shipper
  template:
    metadata:
      labels:
        app: log-shipper
    spec:
      containers:
        - name: shipper
          image: sre-frontend:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "/app/shipper.js"]
          securityContext:
            runAsUser: 0
          envFrom:
            - configMapRef:
                name: log-shipper-config
          volumeMounts:
            - name: code
              mountPath: /app/shipper.js
              subPath: shipper.js
              readOnly: true
            - name: var-log-pods
              mountPath: /var/log/pods
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: code
          configMap:
            name: log-shipper-bin
        - name: var-log-pods
          hostPath:
            path: /var/log/pods
---
# ========================================================
# 6. GRAFANA WITH VICTORIALOGS PLUGIN (Bonus)
# ========================================================
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: default
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "admin"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: default
data:
  GF_USERS_ALLOW_SIGN_UP: "false"
  GF_INSTALL_PLUGINS: "victoriametrics-logs-datasource"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: default
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victoria-logs.default.svc.cluster.local:9428
        isDefault: true
        jsonData: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: default
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana-oss:11.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: grafana-secret
            - configMapRef:
                name: grafana-config
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: default
  labels:
    app: grafana
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000

