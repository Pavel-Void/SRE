    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: default
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana-oss:11.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: grafana-secret
            - configMapRef:
                name: grafana-config
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: slo-dashboard
              mountPath: /var/lib/grafana/dashboards/slo-dashboard.json
              subPath: slo-dashboard.json
            - name: app-dashboard
              mountPath: /var/lib/grafana/dashboards/app-dashboard.json
              subPath: app-dashboard.json
            - name: postgres-dashboard
              mountPath: /var/lib/grafana/dashboards/postgres-dashboard.json
              subPath: postgres-dashboard.json
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: slo-dashboard
          configMap:
            name: grafana-dashboard-slo
        - name: app-dashboard
          configMap:
            name: grafana-dashboard-app
        - name: postgres-dashboard
          configMap:
            name: grafana-dashboard-postgres
---
