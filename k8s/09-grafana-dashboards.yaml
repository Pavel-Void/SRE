apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-slo
  namespace: default
  labels:
    grafana_dashboard: "1"
data:
  slo-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "id": 1,
          "title": "SLI 1: Доступность API (RBSLO) во времени vs SLO (99.0%)",
          "type": "timeseries",
          "gridPos": { "h": 10, "w": 8, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2
              },
              "unit": "percent",
              "min": 0,
              "max": 105
            }
          },
          "options": {
            "legend": {
              "calcs": ["lastNotNull"],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "expr": "clamp_max(clamp_min((sum(rate(http_server_requests_seconds_count{status=~\"2..\"}[20s])) or vector(1)) / (sum(rate(http_server_requests_seconds_count[20s])) or vector(1)) * 100, 0), 100)",
              "legendFormat": "SLI 1 (Успешные запросы 2xx %)",
              "refId": "A"
            },
            {
              "expr": "vector(99)",
              "legendFormat": "Инженерный порог SLO (99.0%)",
              "refId": "B"
            }
          ]
        },
        {
          "id": 2,
          "title": "SLI 2: Задержка обработки (API Latency) vs SLO (95.0%)",
          "type": "timeseries",
          "gridPos": { "h": 10, "w": 8, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2
              },
              "unit": "percent",
              "min": 0,
              "max": 105
            }
          },
          "options": {
            "legend": {
              "calcs": ["lastNotNull"],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "expr": "clamp_max(clamp_min((1 - ((avg(avg_over_time(app_prober_probe_duration_seconds{target=\"health\"}[20s])) or ((sum(rate(http_server_requests_seconds_sum[20s])) or vector(0.01)) / (sum(rate(http_server_requests_seconds_count[20s])) or vector(1)))) / 0.200)) * 100, 0), 100)",
              "legendFormat": "SLI 2 (Latency < 200ms %)",
              "refId": "A"
            },
            {
              "expr": "vector(95)",
              "legendFormat": "Инженерный порог SLO Latency (95.0%)",
              "refId": "B"
            }
          ]
        },
        {
          "id": 3,
          "title": "SLI 3: Синтетический пробер во времени vs SLO (99.5%)",
          "type": "timeseries",
          "gridPos": { "h": 10, "w": 8, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2
              },
              "unit": "percent",
              "min": 0,
              "max": 105
            }
          },
          "options": {
            "legend": {
              "calcs": ["lastNotNull"],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "expr": "clamp_max(clamp_min(avg(avg_over_time(app_prober_probe_success{target=\"health\"}[20s])) * 100, 0), 100)",
              "legendFormat": "SLI 3 (Успешность проб %)",
              "refId": "A"
            },
            {
              "expr": "vector(99.5)",
              "legendFormat": "Инженерный порог SLO (99.5%)",
              "refId": "B"
            }
          ]
        },
        {
          "id": 4,
          "title": "Остаток бюджета ошибок SLO (Error Budget Remaining %)",
          "type": "timeseries",
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 10 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 25,
                "lineWidth": 2
              },
              "unit": "percent",
              "min": 0,
              "max": 105,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 20 },
                  { "color": "green", "value": 70 }
                ]
              }
            }
          },
          "options": {
            "legend": {
              "calcs": ["lastNotNull"],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "expr": "clamp_max(clamp_min(100 - (((sum(rate(http_server_requests_seconds_count{status!~\"2..\"}[20s])) or vector(0)) / (sum(rate(http_server_requests_seconds_count[20s])) or vector(1))) / 0.01 * 100), 0), 100)",
              "legendFormat": "Остаток бюджета ошибок (%)",
              "refId": "A"
            },
            {
              "expr": "vector(0)",
              "legendFormat": "Предел бюджета ошибок (0% — Freeze релизов)",
              "refId": "B"
            }
          ]
        },
        {
          "id": 5,
          "title": "Мониторинг соблюдения SLA сервиса (Порог соглашения: 95.0%)",
          "type": "gauge",
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 10 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "description": "Кумулятивная оценка надежности сервиса за расчетный период. Контрактный порог SLA составляет 95.0% за календарный месяц.",
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 100,
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 90 },
                  { "color": "green", "value": 95 }
                ]
              }
            }
          },
          "options": {
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "expr": "clamp_max(clamp_min(avg_over_time(((sum(rate(http_server_requests_seconds_count{status=~\"2..\"}[20s])) or vector(1)) / (sum(rate(http_server_requests_seconds_count[20s])) or vector(1)) * 100)[5m:10s]), 0), 100)",
              "legendFormat": "Интегральная доступность (Расчетное окно SLA)",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "2s",
      "schemaVersion": 39,
      "tags": ["SRE", "SLO", "SLI", "SLA"],
      "time": { "from": "now-5m", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Park PSU - SRE Мониторинг SLI / SLO / SLA",
      "version": 8
    }
