apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-single-victoria-metrics-agent
  namespace: monitoring
  labels: 
    app.kubernetes.io/instance: vmagent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-metrics-agent
    app.kubernetes.io/version: v1.154.0
    helm.sh/chart: victoria-metrics-agent-0.50.0
spec:
  strategy: {}
  replicas: 1
  selector:
    matchLabels: 
      app.kubernetes.io/instance: vmagent
      app.kubernetes.io/name: victoria-metrics-agent
  template:
    metadata:
      labels: 
        app.kubernetes.io/instance: vmagent
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: victoria-metrics-agent
      annotations: 
        checksum/config: 54235a460df3ea2871ad0b4634672c7afacf5bdba1cf54d20f3de4e1a0ebe58f
    spec:
      serviceAccountName: vm-single-victoria-metrics-agent
      automountServiceAccountToken: true
      securityContext: 
        {}
      containers:
        - name: vmagent
          securityContext: 
            {}
          image: victoriametrics/vmagent:v1.154.0
          imagePullPolicy: IfNotPresent
          workingDir: /
          args: 
            - --envflag.enable
            - --envflag.prefix=VM_
            - --httpListenAddr=:8429
            - --loggerFormat=json
            - --promscrape.config=/config/scrape/scrape.yml
            - --remoteWrite.tmpDataPath=/tmpData
            - --remoteWrite.url=http://vm-single-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/write
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8429
          readinessProbe: 
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe: 
            initialDelaySeconds: 5
            periodSeconds: 15
            tcpSocket:
              port: http
            timeoutSeconds: 5
          resources: 
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmpdata
              mountPath: /tmpData
            - name: config-out
              mountPath: /config/scrape
            
            
      volumes:
        - name: tmpdata
          emptyDir: 
            {}
        - name: config-out
          configMap:
            name: vm-single-victoria-metrics-agent-config
